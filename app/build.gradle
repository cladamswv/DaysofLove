plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carl.lovewithmary'
    compileSdk 36

    defaultConfig {
        applicationId 'com.carl.lovewithmary'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0-beta'
    }

    signingConfigs {
        debug {
            storeFile file('test-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
